name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install
        run: bun install
      - name: Check and build
        run: bun run site:ci
      - name: Confirm generated files are untracked
        run: |
          test -f site/dist/index.html
          test -f site/dist/404.html
          test -f site/dist/assets/app.js
          test -f site/dist/assets/not-found.js
          test -z "$(git ls-files site/dist site/.pages-src .pages-cache)"
