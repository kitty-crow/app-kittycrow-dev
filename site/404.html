<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#b2ebf2">
  <meta name="robots" content="noindex">
  <meta name="description" content="The requested app.kittycrow.dev page could not be found.">
  <title>404 · Kitty's App Index</title>
  <script>
    (() => {
      const repoBase = "/app-kittycrow-dev/";
      const base = document.createElement("base");
      base.href = location.pathname === "/app-kittycrow-dev" || location.pathname.startsWith(repoBase)
        ? repoBase
        : "/";
      document.head.append(base);
    })();
  </script>
  <!-- pages:head -->
  <script>
    document.documentElement.classList.toggle("dark-mode", document.documentElement.dataset.theme === "dark");
  </script>
  <link rel="stylesheet" href="assets/website/styles/core/tokens.css">
  <link rel="stylesheet" href="assets/website/styles/core/theme.light.css">
  <link rel="stylesheet" href="assets/website/styles/core/theme.dark.css">
  <link rel="stylesheet" href="assets/website/styles/core/base.css">
  <link rel="stylesheet" href="assets/website/styles/modules/window.css">
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <a class="brand" href="./" aria-label="Kitty's App Index home">
        <span class="brand__domain">app.kittycrow.dev</span>
        <span class="brand__title">Kitty's App Index</span>
      </a>
      <nav class="header__nav" aria-label="Site links">
        <a href="https://kittycrow.dev/">Blog</a>
        <a href="https://github.com/kitty-crow/app-kittycrow-dev">GitHub</a>
        <button type="button" class="theme-button" data-theme-toggle aria-label="Toggle theme">
          <span data-theme-label aria-hidden="true">☀️</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="main" id="main-content">
    <div class="window-dock" id="window-dock">
      <section id="not-found-window" class="app-window not-found-window" aria-label="Page not found"></section>
    </div>
  </main>

  <footer class="footer">
    <span>Kitty's App Index · <span data-version>v?</span></span>
    <span class="footer__links">
      <a href="https://kittycrow.dev/">kittycrow.dev</a> ·
      <a href="https://github.com/kitty-crow/app-kittycrow-dev">Source</a>
    </span>
  </footer>

  <!-- pages:body -->
  <script type="module" src="assets/not-found.js"></script>
</body>
</html>
